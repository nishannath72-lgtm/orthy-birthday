<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7e7dc"><title>A Little Surprise for Dear Orthy ♡</title>
<style>
:root{--ink:#594857;--rose:#bb7180;--gold:#c09a60}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:linear-gradient(145deg,#f9e5d7,#eee0f2 55%,#f5d8d1)}
#sparkles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-20px;width:10px;height:15px;border-radius:90% 10% 90% 10%;background:#d78f9b99;animation:fall linear infinite}
.wrap{position:relative;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(100%,510px);min-height: min(650px,88vh);display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:clamp(26px,7vw,46px) clamp(22px,6vw,40px);background:#fff9f0d9;border:1px solid #ffffffd9;box-shadow:0 22px 70px #9d738522;position:relative;overflow:hidden;animation:enter .9s ease both}
.kicker{font:10px Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#a77c88}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:enter .8s ease both}
h1{font-size:clamp(48px,12vw,76px);font-weight:400;line-height:1.03;letter-spacing:-.05em;color:#77586b;margin:22px 0}
h1 em{display:block;color:var(--rose);font-weight:400}
h2{font-size:clamp(34px,8vw,48px);font-weight:400;line-height:1.14;color:#77586b;margin:20px 0}
h2 em{color:var(--rose);font-weight:400}
.butterfly{font-size:84px;line-height:1;display:inline-block;cursor:pointer;filter:drop-shadow(0 9px 10px #b7788b44);animation:fly 2.8s ease-in-out infinite;user-select:none;border:0;background:none;padding:8px;min-width:100px;min-height:100px}
.butterfly:focus-visible{outline:2px solid var(--rose);border-radius:50%}
.instruction{font-size:16px;line-height:1.8;color:#8c7484;margin:12px auto 0;max-width:330px}
.ornament{color:var(--gold);font-size:25px;margin:7px}
.message{font-size:clamp(16px,4vw,19px);line-height:1.9;color:#685969;max-width:390px;margin:8px auto}
.signature{font-size:20px;font-style:italic;color:var(--rose);margin-top:20px}
button.next{margin:22px auto 0;border:1px solid #bb718099;background:#fffaf4;padding:15px 24px;border-radius:28px;min-height:46px;min-width:190px;color:#77586b;font:10px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:transform .2s,background .2s}
button.next:hover{transform:translateY(-2px);background:white}
button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.footer{font:9px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#a08b9b}
.heart{color:#c87989;animation:pulse 1.8s ease-in-out infinite;display:inline-block}
.hidden{display:none!important}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-7deg)}50%{transform:translate(13px,-16px) rotate(8deg)}}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes fall{0%{transform:translateY(-5vh) rotate(0);opacity:0}12%{opacity:.7}100%{transform:translate(45px,110vh) rotate(500deg);opacity:0}}
@keyframes pulse{50%{transform:scale(1.2)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<canvas id="sparkles"></canvas><div class="petals" id="petals"></div>
<div class="wrap"><section class="card" aria-live="polite">
<div class="kicker" id="kicker">Psst… a tiny surprise for you</div>
<div class="main" id="main">
 <div class="ornament">✧ &nbsp; ✦ &nbsp; ✧</div>
 <button class="butterfly" id="butterfly" aria-label="Tap the flying butterfly">🦋</button>
 <h1>Catch the <em>butterfly</em></h1>
 <p class="instruction">A little surprise is hiding behind its wings.<br>Tap the butterfly to open it.</p>
</div>
<div><div class="footer">Made with care <span class="heart">♥</span> for Dear Orthy</div></div>
</section></div>
<script>
const main=document.getElementById('main'),kicker=document.getElementById('kicker');
let page=0;
function showPage(n){
 page=n;
 main.style.animation='none';void main.offsetWidth;main.style.animation='enter .8s ease both';
 if(n===1){
 kicker.textContent='Surprise! A wish for you';
 main.innerHTML='<div class="ornament">✧ ✦ ✧</div><h1 style="font-size:clamp(43px,10vw,66px)">Happy Birthday <em>Dear Orthy</em></h1><div class="ornament">♡</div><p class="message">May your day be as lovely as your heart, as bright as your smile, and full of little moments that make you genuinely happy.</p><button class="next" id="next">Open your birthday wish →</button>';
 }else if(n===2){
 kicker.textContent='A little message, just for you';
 main.innerHTML='<div class="ornament">♡</div><h2>You deserve <em>beautiful things</em></h2><p class="message">I hope this new chapter brings you peaceful days, unexpected joy, dreams coming true, and people who remind you how special you are. Keep smiling, keep shining, and always be wonderfully you.</p><div class="signature">For you, Dear Orthy. ♥</div><button class="next" id="next">One last little surprise ✨</button>';
 }else{
 kicker.textContent='One last thing…';
 main.innerHTML='<div class="ornament">☾ ✧ ♡ ✧ ☼</div><h2>A wish that <em>stays with you</em></h2><p class="message">If today gives you one thing, I hope it is this feeling: you matter, you are appreciated, and there is so much beautiful life still waiting for you.</p><div class="signature">Happy Birthday, Dear Orthy <span class="heart">♥</span></div><button class="next" id="next">See the butterfly again ↺</button>';
 }
 const b=document.getElementById('next');
 if(b)b.addEventListener('click',()=>{if(page===3)showPage(0);else showPage(page+1)});
 if(n===1||n===3)celebrate();
}
document.getElementById('butterfly').addEventListener('click',()=>{startMusic();showPage(1)});
/* Soft original birthday-like melody using Web Audio; starts only after a tap. */
let audio=null,master=null,playing=false,timer=null,idx=0;
const notes=[523.25,523.25,587.33,523.25,698.46,659.25,523.25,523.25,587.33,523.25,783.99,698.46,523.25,523.25,1046.5,880,698.46,659.25,587.33];
function tone(f,t,d,vol=.08){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function musicLoop(){if(!playing)return;let t=audio.currentTime+.03;for(let i=0;i<4;i++){tone(notes[idx++%notes.length],t+i*.42,.38,.07)}}
async function startMusic(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio){audio=new AC();master=audio.createGain();master.gain.value=.65;master.connect(audio.destination)}await audio.resume();if(playing)return;playing=true;musicLoop();timer=setInterval(musicLoop,1750)}
function celebrate(){for(let i=0;i<16;i++){const e=document.createElement('i');e.className='petal';e.style.left=(Math.random()*100)+'%';e.style.animationDuration=(3+Math.random()*4)+'s';e.style.animationDelay=(Math.random()*.6)+'s';document.getElementById('petals').appendChild(e);setTimeout(()=>e.remove(),8000)}}
for(let i=0;i<12;i++){const e=document.createElement('i');e.className='petal';e.style.left=Math.random()*100+'%';e.style.animationDuration=(9+Math.random()*12)+'s';e.style.animationDelay=(-Math.random()*15)+'s';document.getElementById('petals').appendChild(e)}
const c=document.getElementById('sparkles'),ctx=c.getContext('2d');let w,h,stars=[];
function resize(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:55},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,a:Math.random()*.4+.1}))}
function draw(){ctx.clearRect(0,0,w,h);for(const s of stars){s.a+=(Math.random()-.5)*.015;s.a=Math.max(.05,Math.min(.5,s.a));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a})`;ctx.fill()}requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();
</script></body></html>
